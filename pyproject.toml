[project]
name = "wulims"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "asgiref==3.11.1",
    "dj-database-url>=3.1.0",
    "django==6.0.2",
    "django-structlog>=10.0.0",
    "gunicorn==25.1.0",
    "mkdocs>=1.6.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-django>=0.60b1",
    "opentelemetry-sdk>=1.39.1",
    "packaging==26.0",
    "psycopg2-binary>=2.9.11",
    "pytest-django==4.12.0",
    "python-dotenv>=1.2.1",
    "ruff==0.15.1",
    "ty==0.0.17",
    "whitenoise>=6.11.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "-ra",
    "--cov",
    "--cov-fail-under=80",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
testpaths = ["tests"]


[tool.coverage.run]
branch = true
relative_files = true
source = ["accounts", "samples", "lims_core", "projects", "instruments", "customers", "experiments", "results"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.paths]
source = [
    ".",
    "*/WuLims",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["accounts",
    "samples",
    "lims_core",
    "config",
    "experiments",
    "instruments",
    "projects",
    "customers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# Disable rules that don't work well with Django's ORM metaclasses
unresolved-attribute = "ignore"
# Django model fields return str at runtime but ty sees them as CharField
invalid-return-type = "warn"

[tool.ty.src]
exclude = ["migrations"]

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "django-debug-toolbar>=6.2.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]
