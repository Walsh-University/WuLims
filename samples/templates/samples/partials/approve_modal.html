<div class="modal-backdrop show"></div>
<div class="modal d-block" tabindex="-1" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Approve Sample {{ sample.sample_id }}</h5>
        <button type="button" class="btn-close"
                onclick="document.getElementById('modal-target').innerHTML = ''"></button>
      </div>

      <div class="modal-body">
        <p class="mb-0">This will mark the sample as <strong>APPROVED</strong>.</p>
        <p class="text-muted small mb-0">Guardrail: only IN_REVIEW samples can be approved.</p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                onclick="document.getElementById('modal-target').innerHTML = ''">Cancel</button>

        <button class="btn btn-primary"
                hx-post="{% url 'samples:approve' sample.pk %}"
                hx-target="#sample-row-{{ sample.pk }}"
                hx-swap="outerHTML">
          Approve
        </button>
      </div>
    </div>
  </div>
</div>
