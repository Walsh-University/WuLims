<form id="filter-form" class="card card-body">
  <div class="row g-2 align-items-end">
    <div class="col-md-6">
      <label class="form-label">{{ form.q.label }}</label>
      {{ form.q }}
    </div>
    <div class="col-md-4">
      <label class="form-label">{{ form.status.label }}</label>
      {{ form.status }}
    </div>
    <div class="col-md-2">
      <button class="btn btn-secondary w-100" type="button"
              hx-get="{% url 'samples:table' %}"
              hx-target="#table-target"
              hx-include="#filter-form">
        Refresh
      </button>
    </div>
  </div>
</form>
<script>
  document.querySelectorAll("#filter-form input, #filter-form select").forEach(el => {
    el.classList.add("form-control");
  });

  // Before request is sent
  document.body.addEventListener('htmx:beforeRequest', function(evt) {
      console.log('Request:', evt.detail);
  });

  // After response is received
  document.body.addEventListener('htmx:afterRequest', function(evt) {
      console.log('Response:', evt.detail);
  });

  // When a request fails
  document.body.addEventListener('htmx:responseError', function(evt) {
      console.log('Error:', evt.detail);
  });

  // When the swap happens
  document.body.addEventListener('htmx:afterSwap', function(evt) {
      console.log('Swapped:', evt.detail);
  });
</script>
