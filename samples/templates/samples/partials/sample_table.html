<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Sample ID</th>
          <th>Project</th>
          <th>Client</th>
          <th>Status</th>
          <th>Received</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for s in samples %}
          {% include "samples/partials/sample_row.html" with s=s %}
        {% empty %}
          <tr><td colspan="6" class="p-3 text-muted">No samples found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
