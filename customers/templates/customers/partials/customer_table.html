<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Customer ID</th>
          <th>Name</th>
          <th>External ID</th>
          <th>Type</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for customer in customers %}
          {% include "customers/partials/customer_row.html" with customer=customer %}
        {% empty %}
          <tr><td colspan="6" class="p-3 text-muted">No customers found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
