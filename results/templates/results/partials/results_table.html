<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Result ID</th>
                <th>Project</th>
                <th>Client</th>
                <th>Status</th>
                <th>Approved</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            {% for r in results %}
                {% include "results/partials/results_row.html" with r=r %}
                {% empty %}
                <tr><td colspan="6" class="p-3 text-muted">No results found.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
