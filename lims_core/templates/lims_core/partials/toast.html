<div id="toast-target" hx-swap-oob="beforeend">
  <div class="toast show align-items-center text-bg-{{ level|default:'secondary' }} border-0 mb-2" role="alert">
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto"
              onclick="this.closest('.toast').remove()"></button>
    </div>
  </div>
</div>
