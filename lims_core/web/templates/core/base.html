<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}WuLims{% endblock %}</title>

    <!-- HTMX + Alpine -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.wulims.min.css' %}">

    <style>
        .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 2000; }
    </style>
</head>

<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">LIMS</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'samples:list' %}">Samples</a>
        </div>
    </div>
</nav>

<div class="toast-container" id="toast-target"></div>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<!-- HTMX: when server sends HX-Trigger, you can optionally hook it here later -->
</body>
</html>
