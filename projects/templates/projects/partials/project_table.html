<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Status</th>
          <th>Customer</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for p in projects %}
          {% include "projects/partials/project_row.html" with p=p %}
        {% empty %}
          <tr><td colspan="6" class="p-3 text-muted">No projects found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
