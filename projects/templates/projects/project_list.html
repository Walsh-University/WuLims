{% extends "lims_core/base.html" %}
{% block title %}Projects - WuLims{% endblock %}
{% block nav_projects_active %}active{% endblock %}
{% block breadcrumb_current %}Projects{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Projects</h1>
</div>

<div
  hx-get="{% url 'projects:table' %}"
  hx-trigger="load, keyup changed delay:300ms from:#filter-form, change from:#filter-form"
  hx-target="#table-target"
  hx-include="#filter-form"
>
  {% include "samples/partials/sample_filters.html" %}
</div>

<div id="table-target" class="mt-3"></div>
<div id="modal-target"></div>
{% endblock %}
