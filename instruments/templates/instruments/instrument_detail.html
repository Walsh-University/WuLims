{% extends "lims_core/base.html" %}
{% block title %}Instrument {{ instrument.name }} - WuLims{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h1 class="h3 mb-0">Instrument {{ instrument.name }}</h1>
    <div class="text-muted">{{ instrument.manufacturer }} • {{ instrument.model }}</div>
  </div>
</div>

<ul class="nav nav-tabs">
  <li class="nav-item">
    <a class="nav-link active"
       hx-get="{% url 'instruments:detail' instrument.id %}?tab=overview"
       hx-target="#tab-target"
       hx-swap="innerHTML">Overview</a>
  </li>
  <li class="nav-item">
    <a class="nav-link"
       hx-get="{% url 'instruments:detail' instrument.id %}?tab=maintenance"
       hx-target="#tab-target"
       hx-swap="innerHTML">Maintenance</a>
  </li>
</ul>

<div id="tab-target" class="mt-3"
     hx-get="{% url 'instruments:detail' instrument.id %}?tab=overview"
     hx-trigger="load"
     hx-target="#tab-target"
     hx-swap="innerHTML"></div>

<div id="modal-target"></div>
{% endblock %}
