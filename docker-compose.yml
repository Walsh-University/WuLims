services:
  db:
    image: postgres:16
    container_name: wulims_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wulims
      POSTGRES_USER: wulims
      POSTGRES_PASSWORD: wulims_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
